<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New request - HelpLink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">HelpLink</h1>
    <nav class="main-nav">
      <ul>
        <li><a href="Index.html">Home</a></li>
        <li><a href="signup.html">Sign up</a></li>
        <li><a href="signin.html">Sign in</a></li>
        <li><a href="new-request.html" class="active">New request</a></li>
        <li><a href="helpers.html">Find helpers</a></li>
        <li><a href="my-requests.html">My requests</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- create a request -->
    <section id="new-request" class="section">
      <h2>Create a help request</h2>
      <form class="form-box" action="Index.html" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Need urgent help: kitchen water leak" required>

        <label for="category">Category</label>
        <select id="category" name="category">
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Computers and software</option>
          <option>CV and career</option>
          <option>Design</option>
          <option>Other</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Explain the problem"></textarea>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="Tripoli">

        <label class="inline urgent"><input type="checkbox" name="urgent"> This request is urgent</label>

        <button type="submit" class="btn">Submit request</button>
      </form>
    </section>

  </main>



</body>
</html>
